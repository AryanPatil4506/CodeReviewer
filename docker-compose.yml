volumes:
    chroma_data:
    ollama_data:
    visualizer_data:
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CHROMA_DB_PATH=/app/chroma
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - chroma_data:/app/chroma
    
  ollama:
    image: ollama/ollama
    env_file:
      - .env
    environment:
      - LLM_PROVIDER
      - OLLAMA_CLASSIFIER
      - OLLAMA_JUDGE_MODEL
      - OLLAMA_SPECIALIST_MODEL
      - OLLAMA_DEFAULT_MODEL
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-entrypoint.sh:/ollama-entrypoint.sh
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: []
    entrypoint: sh -c "chmod +x /ollama-entrypoint.sh && /ollama-entrypoint.sh"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  mcp-server:
    build:
      context: .
      dockerfile: app/mcp_server/DockerFile
    stdin_open: true
    tty: false
    env_file:
      - .env
    environment:
      - CHROMA_DB_PATH=/app/chroma
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - chroma_data:/app/chroma
    depends_on:
      ollama:
        condition: service_healthy

  visualizer-backend:
    build:
      context: .                                    # repo root, not visualizer/backend
      dockerfile: visualizer/backend/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env                                          # reuses GITHUB_TOKEN, LLM_PROVIDER, etc.
    environment:
      - CHROMA_DB_PATH=/app/chroma
      - OLLAMA_BASE_URL=http://ollama:11434
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - chroma_data:/app/chroma                        # SAME volume as `app`/`mcp-server` - shared memory
      - visualizer_data:/repo/visualizer/backend/data   # its own execution-history sqlite db

  visualizer-frontend:
    build: ./visualizer/frontend
    ports:
      - "3000:80"
    depends_on:
      - visualizer-backend